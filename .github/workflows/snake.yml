name: Cobrinha das contribuições

on:
  schedule:
    - cron: "0 9 * * *" # todo dia, 06:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#1a7f37&color_dots=#ebedf0,#aceebb,#4ac26b,#2da44e,#116329
            dist/snake-dark.svg?palette=github-dark&color_snake=#3fb950

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
