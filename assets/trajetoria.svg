<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Trajetória: o primeiro código aos 13 anos, profissional aos 16, professor de SEO, quality assurance, líder de times e hoje CTO da NMK.">
<style>
  .t { font: 700 18px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #eafff0; } .s { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #8fbf98; }
  .tag { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #00ff41; letter-spacing: 1px; }
  .h { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #008f11; letter-spacing: 6px; }
</style>
<defs><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#003b00"/><stop offset="1" stop-color="#00ff41"/></linearGradient></defs>
<rect width="1200" height="300" rx="14" fill="#0d0208"/>
<text x="30" y="34" class="h">// TRAJETÓRIA</text>
<line x1="150" y1="150" x2="1050" y2="150" stroke="url(#ln)" stroke-width="4" stroke-linecap="round" stroke-dasharray="900" stroke-dashoffset="900">
  <animate attributeName="stroke-dashoffset" from="900" to="0" dur="2.6s" begin=".2s" fill="freeze"/>
</line>
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0.40s" dur=".4s" fill="freeze"/>
  <circle cx="150" cy="150" r="10" fill="#0d0208" stroke="#00ff41" stroke-width="3"/>
  <circle cx="150" cy="150" r="4" fill="#00ff41"/>
  <text x="150" y="184" text-anchor="middle" class="tag">13 anos</text>
  <text x="150" y="98" text-anchor="middle" class="t">O primeiro código</text>
  <text x="150" y="120" text-anchor="middle" class="s">a tecnologia vira caminho</text>
</g><g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0.85s" dur=".4s" fill="freeze"/>
  <circle cx="330" cy="150" r="10" fill="#0d0208" stroke="#00ff41" stroke-width="3"/>
  <circle cx="330" cy="150" r="4" fill="#00ff41"/>
  <text x="330" y="124" text-anchor="middle" class="tag">16–17</text>
  <text x="330" y="212" text-anchor="middle" class="t">Profissional</text>
  <text x="330" y="234" text-anchor="middle" class="s">agências e software houses</text>
</g><g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="1.30s" dur=".4s" fill="freeze"/>
  <circle cx="510" cy="150" r="10" fill="#0d0208" stroke="#00ff41" stroke-width="3"/>
  <circle cx="510" cy="150" r="4" fill="#00ff41"/>
  <text x="510" y="184" text-anchor="middle" class="tag">SEO</text>
  <text x="510" y="98" text-anchor="middle" class="t">Professor de SEO</text>
  <text x="510" y="120" text-anchor="middle" class="s">nasce o Renatho com H</text>
</g><g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="1.75s" dur=".4s" fill="freeze"/>
  <circle cx="690" cy="150" r="10" fill="#0d0208" stroke="#00ff41" stroke-width="3"/>
  <circle cx="690" cy="150" r="4" fill="#00ff41"/>
  <text x="690" y="124" text-anchor="middle" class="tag">QA</text>
  <text x="690" y="212" text-anchor="middle" class="t">Quality assurance</text>
  <text x="690" y="234" text-anchor="middle" class="s">software houses</text>
</g><g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="2.20s" dur=".4s" fill="freeze"/>
  <circle cx="870" cy="150" r="10" fill="#0d0208" stroke="#00ff41" stroke-width="3"/>
  <circle cx="870" cy="150" r="4" fill="#00ff41"/>
  <text x="870" y="184" text-anchor="middle" class="tag">Gestão</text>
  <text x="870" y="98" text-anchor="middle" class="t">Líder de times</text>
  <text x="870" y="120" text-anchor="middle" class="s">marketing, dev e estratégia</text>
</g><g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="2.65s" dur=".4s" fill="freeze"/>
  <circle cx="1050" cy="150" r="13" fill="none" stroke="#00ff41"><animate attributeName="r" values="13;29" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="1050" cy="150" r="13" fill="#0d0208" stroke="#00ff41" stroke-width="3"/>
  <circle cx="1050" cy="150" r="7" fill="#00ff41"/>
  <text x="1050" y="124" text-anchor="middle" class="tag">Hoje</text>
  <text x="1050" y="212" text-anchor="middle" class="t">CTO da NMK</text>
  <text x="1050" y="234" text-anchor="middle" class="s">produtos com IA</text>
</g>
<rect x=".5" y=".5" width="1199" height="299" rx="14" fill="none" stroke="#00ff41" stroke-opacity=".3"/>
</svg>