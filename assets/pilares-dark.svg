<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" role="img" aria-label="O que eu faço: estratégia empresarial, processos de negócio, automação e software sob medida com IA.">
<style>
  .t { font: 700 19px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #e6edf3; } .s { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #8b949e; }
  .n { font: 700 22px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #3fb950; } .h { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #2ea043; letter-spacing: 6px; }
  .q { font: italic 15px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #3fb950; }
</style>
<rect width="600" height="470" rx="14" fill="#0d1117"/>
<text x="24" y="34" class="h">// O QUE EU FAÇO</text>
<text x="34" y="80" class="n">01</text>
  <text x="80" y="80" class="t">Estratégia empresarial</text>
  <text x="80" y="104" class="s">o problema do negócio vem antes</text>
  <rect x="80" y="120" width="480" height="4" rx="2" fill="#1c3324"/>
  <rect x="80" y="120" width="480" height="4" rx="2" fill="#3fb950">
    <animate attributeName="width" dur="8.0s" repeatCount="indefinite" keyTimes="0;0.0375;0.1625;.9;1" values="0;0;480;480;0"/></rect><text x="34" y="172" class="n">02</text>
  <text x="80" y="172" class="t">Processos de negócio</text>
  <text x="80" y="196" class="s">mapear, simplificar, medir</text>
  <rect x="80" y="212" width="480" height="4" rx="2" fill="#1c3324"/>
  <rect x="80" y="212" width="480" height="4" rx="2" fill="#3fb950">
    <animate attributeName="width" dur="8.0s" repeatCount="indefinite" keyTimes="0;0.1000;0.2250;.9;1" values="0;0;480;480;0"/></rect><text x="34" y="264" class="n">03</text>
  <text x="80" y="264" class="t">Automação</text>
  <text x="80" y="288" class="s">n8n, Make, Typebot, Edge Functions</text>
  <rect x="80" y="304" width="480" height="4" rx="2" fill="#1c3324"/>
  <rect x="80" y="304" width="480" height="4" rx="2" fill="#3fb950">
    <animate attributeName="width" dur="8.0s" repeatCount="indefinite" keyTimes="0;0.1625;0.2875;.9;1" values="0;0;480;480;0"/></rect><text x="34" y="356" class="n">04</text>
  <text x="80" y="356" class="t">Software sob medida com IA</text>
  <text x="80" y="380" class="s">do PRD ao app em produção</text>
  <rect x="80" y="396" width="480" height="4" rx="2" fill="#1c3324"/>
  <rect x="80" y="396" width="480" height="4" rx="2" fill="#3fb950">
    <animate attributeName="width" dur="8.0s" repeatCount="indefinite" keyTimes="0;0.2250;0.3500;.9;1" values="0;0;480;480;0"/></rect>
<text x="300.0" y="448" text-anchor="middle" class="q">"Solution is more than software."</text>
<rect x=".5" y=".5" width="599" height="469" rx="14" fill="none" stroke="#30363d"/>
</svg>