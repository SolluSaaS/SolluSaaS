<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Trajetória: Amiga e disquetes aos 13, suporte aos 16, professor de redes aos 18, profissional aos 20, professor de SEO, quality assurance, líder de times e hoje CTO da NMK.">
<style>
