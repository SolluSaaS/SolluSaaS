<text x="450.0" y="24" text-anchor="middle" fill="#9a9a9a" style="font-size:13px">nunes@nmk: ~ (zion)</text>
<text x="28" y="82" opacity="0" fill="#00ff41"><tspan fill="#5fd7ff">nunes@nmk</tspan><tspan fill="#8a8a8a">:</tspan><tspan fill="#c792ea">~</tspan><tspan fill="#8a8a8a">$ </tspan>whoami<animate attributeName="opacity" from="0" to="1" begin="0.30s" dur="0.15s" fill="freeze"/></text><text x="28" y="112" opacity="0" fill="#cfe8d5"><tspan fill="#8a8a8a">  </tspan>Renatho Siqueira, o Nunes. Renatho com H.<animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.15s" fill="freeze"/></text><text x="28" y="142" opacity="0" fill="#00ff41"><tspan fill="#5fd7ff">nunes@nmk</tspan><tspan fill="#8a8a8a">:</tspan><tspan fill="#c792ea">~</tspan><tspan fill="#8a8a8a">$ </tspan>cat cargo.txt<animate attributeName="opacity" from="0" to="1" begin="1.00s" dur="0.15s" fill="freeze"/></text><text x="28" y="172" opacity="0" fill="#cfe8d5"><tspan fill="#8a8a8a">  </tspan>CTO da NMK: soluções estratégicas para PMEs em Portugal e no Brasil.<animate attributeName="opacity" from="0" to="1" begin="1.35s" dur="0.15s" fill="freeze"/></text><text x="28" y="202" opacity="0" fill="#00ff41"><tspan fill="#5fd7ff">nunes@nmk</tspan><tspan fill="#8a8a8a">:</tspan><tspan fill="#c792ea">~</tspan><tspan fill="#8a8a8a">$ </tspan>cat stack-mental.txt<animate attributeName="opacity" from="0" to="1" begin="1.70s" dur="0.15s" fill="freeze"/></text><text x="28" y="232" opacity="0" fill="#cfe8d5"><tspan fill="#8a8a8a">  </tspan>Estratégia &gt; processo &gt; automação &gt; software. Nessa ordem.<animate attributeName="opacity" from="0" to="1" begin="2.05s" dur="0.15s" fill="freeze"/></text><text x="28" y="262" opacity="0" fill="#00ff41"><tspan fill="#5fd7ff">nunes@nmk</tspan><tspan fill="#8a8a8a">:</tspan><tspan fill="#c792ea">~</tspan><tspan fill="#8a8a8a">$ </tspan>uptime<animate attributeName="opacity" from="0" to="1" begin="2.40s" dur="0.15s" fill="freeze"/></text><text x="28" y="292" opacity="0" fill="#cfe8d5"><tspan fill="#8a8a8a">  </tspan>35+ anos em tecnologia. Começou aos 13. Profissional desde os 16.<animate attributeName="opacity" from="0" to="1" begin="2.75s" dur="0.15s" fill="freeze"/></text><text x="28" y="322" opacity="0" fill="#00ff41"><tspan fill="#5fd7ff">nunes@nmk</tspan><tspan fill="#8a8a8a">:</tspan><tspan fill="#c792ea">~</tspan><tspan fill="#8a8a8a">$ </tspan>echo $LEMA<animate attributeName="opacity" from="0" to="1" begin="3.10s" dur="0.15s" fill="freeze"/></text><text x="28" y="352" opacity="0" fill="#cfe8d5"><tspan fill="#8a8a8a">  </tspan>Stay hungry, stay foolish.<animate attributeName="opacity" from="0" to="1" begin="3.45s" dur="0.15s" fill="freeze"/></text>
<text x="28" y="382" fill="#00ff41"><tspan fill="#5fd7ff">nunes@nmk</tspan><tspan fill="#8a8a8a">:</tspan><tspan fill="#c792ea">~</tspan><tspan fill="#8a8a8a">$ </tspan><tspan class="blink">█</tspan></text>
